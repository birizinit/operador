<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP Opções Binárias</title>
  <meta name="description" content="MVP de opções binárias: selecione carteira, visualize saldo, abra ordens e veja o histórico.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elev: #0f0f12;
      --text: #ffffff;
      --muted: #a1a1aa;
      --purple: #7c3aed;
      --purple-600: #6d28d9;
      --border: #2a2a33;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * { box-sizing:border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--text); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(15, 15, 18, 0.9);
      border-bottom: 1px solid var(--purple);
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 1000;
      backdrop-filter: blur(6px);
    }
    .header-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--purple), #9b5cf0);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:700;
    }
    .controls {
      display: flex; align-items: center; gap: 10px;
    }
    .select, .btn, .balance {
      height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-weight: 600;
    }
    .select { cursor: pointer; }
    .select:focus-visible, .btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
    .btn { cursor: pointer; border-color: var(--purple); }
    .btn.primary { background: var(--purple); border-color: var(--purple); }
    .btn.primary:hover { background: var(--purple-600); }
    .btn.ghost { background: transparent; border-color: var(--purple); }
    .btn.ghost:hover { background: rgba(124, 58, 237, 0.12); }
    .balance { border-color: var(--purple); font-weight: 700; }

    /* Main */
    .main {
      padding: 88px 16px 24px;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-elev);
      padding: 16px;
    }
    .panel-title { font-weight: 700; margin-bottom: 10px; }

    /* Trade panel */
    .pair { display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
    .btc-icon { width: 22px; height: 22px; border-radius: 50%; background: #f7931a; color:#000; font-weight: 700; display:flex; align-items:center; justify-content:center; }
    .row { display:flex; flex-wrap: wrap; align-items:center; gap: 8px; margin-top: 8px; }
    .chip { height: 34px; padding: 0 12px; border:1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text); font-weight:600; cursor:pointer; }
    .chip:hover { border-color: var(--purple); }
    .chip.active { background: rgba(124,58,237,0.12); border-color: var(--purple); }
    .btn.buy { border-color: var(--green); color: var(--green); }
    .btn.buy:hover { background: rgba(16,185,129,0.12); }
    .btn.sell { border-color: var(--red); color: var(--red); }
    .btn.sell:hover { background: rgba(239,68,68,0.12); }

    .amount-wrap { display:flex; align-items:center; gap:8px; margin-top: 8px; }
    .amount-input { height: 36px; width: 120px; border-radius: 10px; border:1px solid var(--border); background: transparent; color: var(--text); padding: 0 10px; font-weight: 600; }

    .order-actions { display:flex; gap: 10px; margin-top: 12px; }

    /* History */
    .history-header { display:flex; align-items:center; justify-content: space-between; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .status { font-weight: 700; }
    .status.open { color: var(--yellow); }
    .status.win { color: var(--green); }
    .status.loss { color: var(--red); }
    .status.cancelled { color: var(--muted); }

    /* Toast */
    .toast { position: fixed; right: 16px; bottom: 16px; background: var(--bg-elev); border: 1px solid var(--purple); color: var(--text); padding: 12px 14px; border-radius: 10px; opacity: 0; transform: translateY(8px); transition: all .2s ease; z-index: 1100; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (min-width: 900px) {
      .main { grid-template-columns: 1fr 1.4fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div>Binary MVP</div>
      </div>
      <div class="controls">
        <select id="wallet-select" class="select" aria-label="Selecione a carteira"></select>
        <div id="balance" class="balance">R$ 0,00</div>
        <a class="btn ghost" href="https://app.asafebroker.com/finance/deposit" target="_blank" rel="noopener noreferrer">Depósito</a>
        <a class="btn ghost" href="https://app.asafebroker.com/finance/withdrawl" target="_blank" rel="noopener noreferrer">Saque</a>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="panel" id="trade-panel">
      <div class="panel-title">Abrir ordem</div>
      <div class="pair"><span class="btc-icon">₿</span> <strong>BTCUSDT</strong></div>
      <div class="row" id="directions">
        <button class="btn buy" data-direction="BUY">BUY</button>
        <button class="btn sell" data-direction="SELL">SELL</button>
      </div>
      <div class="row" id="times">
        <button class="chip" data-time="01:00">01:00</button>
        <button class="chip" data-time="05:00">05:00</button>
        <button class="chip" data-time="15:00">15:00</button>
      </div>
      <div class="amount-wrap">
        <input id="amount" type="number" min="1" step="1" value="20" class="amount-input" aria-label="Valor da ordem">
        <button class="chip" data-amount="10">R$ 10</button>
        <button class="chip" data-amount="20">R$ 20</button>
        <button class="chip" data-amount="50">R$ 50</button>
      </div>
      <div class="order-actions">
        <button id="open-order" class="btn primary">Enviar ordem</button>
      </div>
      <div id="trade-error" style="margin-top:8px;color:#ff6b6b;min-height:18px;"></div>
    </section>

    <section class="panel" id="history-panel">
      <div class="history-header">
        <div class="panel-title">Histórico de trades</div>
        <button id="refresh-history" class="btn">Atualizar</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Símbolo</th>
              <th>Direção</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Data/Hora</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr><td colspan="5" style="color:var(--muted);">Sem registros</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const API_BASE = 'https://broker-api.mybroker.dev';
    const CURRENCY = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

    const els = {
      walletSelect: document.getElementById('wallet-select'),
      balance: document.getElementById('balance'),
      openOrder: document.getElementById('open-order'),
      amount: document.getElementById('amount'),
      tradeError: document.getElementById('trade-error'),
      historyBody: document.getElementById('history-body'),
      refreshHistory: document.getElementById('refresh-history'),
      toast: document.getElementById('toast'),
    };

    let state = {
      token: null,
      wallets: [],
      typeToWallet: {},
      selectedType: null,
      selectedDirection: 'BUY',
      selectedTime: '01:00',
    };

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      setTimeout(() => els.toast.classList.remove('show'), 2000);
    }

    function getAuthHeaders() {
      return { 'api-token': state.token };
    }

    async function fetchJson(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: { ...getAuthHeaders(), ...(options.headers || {}) },
      });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(text || 'Erro na requisição');
      }
      return res.json();
    }

    function updateBalanceUI() {
      const wallet = state.typeToWallet[state.selectedType];
      const amount = Number(wallet?.balance || 0);
      els.balance.textContent = CURRENCY.format(amount);
    }

    function bindChips() {
      document.querySelectorAll('#times .chip').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedTime = btn.dataset.time;
          document.querySelectorAll('#times .chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
      // default active
      const firstTime = document.querySelector('#times .chip');
      if (firstTime) firstTime.click();

      document.querySelectorAll('.amount-wrap .chip').forEach(btn => {
        btn.addEventListener('click', () => {
          els.amount.value = btn.dataset.amount;
        });
      });

      document.querySelectorAll('#directions .btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDirection = btn.dataset.direction;
          toast(`Direção: ${state.selectedDirection}`);
        });
      });
    }

    async function loadWallets() {
      const data = await fetchJson('/token/wallets', { method: 'GET' });
      state.wallets = data;
      state.typeToWallet = {};
      const types = [];
      data.forEach(w => { types.includes(w.type) || types.push(w.type); state.typeToWallet[w.type] = w; });

      els.walletSelect.innerHTML = '';
      types.forEach(type => {
        const opt = document.createElement('option');
        opt.value = type; opt.textContent = type; els.walletSelect.appendChild(opt);
      });

      state.selectedType = types[0] || 'REAL';
      els.walletSelect.value = state.selectedType;
      updateBalanceUI();

      els.walletSelect.addEventListener('change', () => {
        state.selectedType = els.walletSelect.value;
        updateBalanceUI();
        toast(`Carteira: ${state.selectedType}`);
      });
    }

    async function loadHistory() {
      try {
        const trades = await fetchJson('/token/trades', { method: 'GET' });
        renderHistory(trades);
      } catch (e) {
        renderHistory([]);
        toast('Erro ao carregar histórico');
      }
    }

    function renderHistory(trades) {
      els.historyBody.innerHTML = '';
      if (!trades || trades.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 5; td.style.color = '#a1a1aa';
        td.textContent = 'Sem registros';
        tr.appendChild(td); els.historyBody.appendChild(tr); return;
      }
      for (const t of trades) {
        const tr = document.createElement('tr');
        const sym = document.createElement('td');
        sym.innerHTML = '<span class="btc-icon" style="display:inline-flex;width:18px;height:18px;margin-right:6px;">₿</span>' + (t.symbol || 'BTCUSDT');
        const dir = document.createElement('td');
        dir.textContent = t.direction || '';
        const amt = document.createElement('td');
        amt.textContent = CURRENCY.format(Number(t.amount || 0));
        const status = document.createElement('td');
        const s = (t.status || '').toLowerCase();
        status.className = 'status ' + s;
        status.textContent = t.status || '';
        const dt = document.createElement('td');
        const d = t.createdAt ? new Date(t.createdAt) : null;
        dt.textContent = d ? d.toLocaleString('pt-BR') : '';
        tr.append(sym, dir, amt, status, dt);
        els.historyBody.appendChild(tr);
      }
    }

    async function openOrder() {
      els.tradeError.textContent = '';
      const amount = Number(els.amount.value);
      if (!amount || amount <= 0) {
        els.tradeError.textContent = 'Informe um valor válido.';
        return;
      }
      const isDemo = (state.selectedType || '').toUpperCase() === 'DEMO';
      const body = {
        isDemo,
        closeType: state.selectedTime,
        direction: state.selectedDirection,
        symbol: 'BTCUSDT',
        amount: amount
      };
      try {
        const res = await fetch(`${API_BASE}/token/trades/open`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text().catch(() => 'Erro ao abrir ordem'));
        const data = await res.json();
        toast(`Ordem criada: ${data.id || 'OK'}`);
        // Atualiza saldo após ordem
        await loadWallets();
        // Atualiza histórico
        await loadHistory();
      } catch (e) {
        els.tradeError.textContent = e.message || 'Erro ao abrir ordem.';
      }
    }

    async function init() {
      state.token = sessionStorage.getItem('apiToken');
      if (!state.token) { window.location.href = 'index.html'; return; }
      try {
        await loadWallets();
        await loadHistory();
      } catch (e) {
        toast('Falha ao inicializar. Faça login novamente.');
        setTimeout(() => window.location.href = 'index.html', 1200);
        return;
      }
      bindChips();
      els.openOrder.addEventListener('click', openOrder);
      els.refreshHistory.addEventListener('click', loadHistory);
    }

    init();
  </script>
</body>
</html>
