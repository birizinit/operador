<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login seguro com token para acessar suas carteiras." />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://broker-api.mybroker.dev; img-src 'self' https://uploadsww.s3.us-east-1.amazonaws.com data:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline';" />
  <title>Login com Token</title>
  <!-- Fonte Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      font-family: "Montserrat", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
      overflow-y: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(40px);
      animation: slideUp 1s ease forwards 0.6s;
    }

    .logo img {
      max-width: 70%;
      height: auto;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards 0.8s;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
      text-align: left;
    }
    .input-box {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      background: transparent;
      border-radius: 10px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-box:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }
    .input-label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #888;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .input-box:focus + .input-label,
    .input-box:not(:placeholder-shown) + .input-label {
      top: -8px;
      left: 10px;
      font-size: 12px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.8);
      padding: 0 6px;
      border-radius: 4px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: #dddddd;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .input-box:focus-visible,
    .btn:focus-visible,
    .help-link:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .error {
      margin-top: 12px;
      color: #ff6b6b;
      font-size: 14px;
      min-height: 18px;
    }

    .help-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      color: #aaaaaa;
      text-decoration: none;
      position: relative;
    }
    .help-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 1px;
      background: #ffffff;
      transition: width 0.3s ease;
    }
    .help-link:hover {
      color: #ffffff;
    }
    .help-link:hover::after {
      width: 100%;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      .logo img {
        max-width: 90%;
        margin-bottom: 25px;
      }
      .input-box,
      .btn {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://uploadsww.s3.us-east-1.amazonaws.com/files/01JZ0KZMJKEDHA85PQJW50FCMQ/01JZ0KZP189HQA23RGBXN8AKEQ/TENANT_IMAGE/TENANT_LOGO/01JZ0R9Q273HH374D88KEX63ZH.png" alt="Logo" />
    </div>
    <form onsubmit="login(event)">
      <div class="input-group">
        <input type="text" id="token" class="input-box" placeholder=" " required />
        <label for="token" class="input-label">Digite aqui seu token para acessar!</label>
      </div>
      <button type="submit" class="btn">Entrar</button>
    </form>
    <a href="#" class="help-link">Não sabe como encontrar seu token? Assista!</a>
    <div id="error" class="error" role="alert" aria-live="assertive"></div>
  </div>

  <script>
function setLoading(isLoading) {
  const btn = document.querySelector('.btn');
  const card = document.querySelector('.card');
  btn.disabled = isLoading;
  btn.textContent = isLoading ? 'Entrando...' : 'Entrar';
  card.setAttribute('aria-busy', String(isLoading));
}

function showError(message) {
  const errorEl = document.getElementById('error');
  errorEl.textContent = message || '';
}

async function login(event) {
  event.preventDefault();
  showError('');
  const token = document.getElementById('token').value.trim();
  if (!token) {
    showError('Digite seu token!');
    return;
  }

  setLoading(true);
  try {
    // Valida o token fazendo uma chamada simples
    const response = await fetch('https://broker-api.mybroker.dev/token/wallets', {
      method: 'GET',
      headers: {
        'api-token': token
      }
    });

    if (!response.ok) throw new Error('Token inválido ou erro ao conectar com a API.');

    // Não armazenamos os dados das carteiras; apenas o token e vamos buscar na home
    sessionStorage.setItem('apiToken', token);

    window.location.href = 'home.html';
  } catch (error) {
    showError(error.message);
    console.error(error);
  } finally {
    setLoading(false);
  }
}
  </script>
</body>
</html>
